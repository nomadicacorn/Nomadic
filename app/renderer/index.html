<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'">
<title>파랑새 쪽지</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <img src="../assets/icon.png" alt="" class="logo">
    <div class="titles">
      <h1>파랑새 쪽지</h1>
      <div id="who" class="who"></div>
    </div>
    <span id="status" class="status"></span>
  </header>

  <nav>
    <button data-tab="inbox" class="active">받은 쪽지 <span id="unread" class="badge" hidden></span></button>
    <button data-tab="compose">쪽지 쓰기</button>
    <button data-tab="sent">보낸 쪽지</button>
    <button data-tab="settings">설정</button>
  </nav>

  <main>
    <section id="tab-inbox" class="tab active">
      <ul id="inboxList" class="notes"></ul>
      <p id="inboxEmpty" class="empty">아직 날아온 쪽지가 없어요.<br>파랑새가 곧 찾아올 거예요 🐦</p>
    </section>

    <section id="tab-compose" class="tab">
      <label class="field-label">누구에게 보낼까요?</label>
      <div id="recipients" class="chips"></div>

      <label class="field-label" for="text">쪽지 내용</label>
      <textarea id="text" maxlength="1000" placeholder="오늘 있었던 일, 하고 싶은 말을 적어 보세요"></textarea>
      <div class="row">
        <div id="colors" class="colors">
          <button data-color="cream" class="active" title="크림"></button>
          <button data-color="pink" title="분홍"></button>
          <button data-color="mint" title="민트"></button>
          <button data-color="sky" title="하늘"></button>
        </div>
        <span id="count" class="count">0 / 1000</span>
      </div>
      <button id="sendBtn" class="primary big">🐦 파랑새에게 맡기기</button>
      <p id="sendMsg" class="msg"></p>
      <p class="hint">Ctrl + Enter 로도 보낼 수 있어요. 꺼져 있는 친구에게는 다음에 켤 때 배달돼요.</p>
    </section>

    <section id="tab-sent" class="tab">
      <ul id="sentList" class="notes"></ul>
      <p id="sentEmpty" class="empty">보낸 쪽지가 없어요.</p>
    </section>

    <section id="tab-settings" class="tab">
      <form id="settingsForm">
        <label class="field-label" for="name">내 이름 (친구들에게 보이는 이름)</label>
        <input id="name" maxlength="20" placeholder="예: 민지" required>

        <label class="field-label" for="nest">둥지 코드</label>
        <input id="nest" maxlength="64" placeholder="예: 우리반-파랑새-2026" required>
        <p class="hint">친구들과 <b>똑같은 둥지 코드</b>를 입력해야 서로 쪽지를 주고받을 수 있어요. 남이 짐작하기 어렵게 정해 주세요.</p>

        <label class="field-label" for="serverUrl">우체국 주소</label>
        <input id="serverUrl" placeholder="ws://192.168.0.10:8787" required>
        <p class="hint">우체국(서버)을 켠 친구에게 주소를 받아서 넣어 주세요. 자세한 방법은 README를 봐 주세요.</p>

        <label class="check"><input type="checkbox" id="autoStart"> 윈도우 시작할 때 같이 켜기</label>
        <label class="check"><input type="checkbox" id="sound"> 파랑새 짹짹 소리</label>

        <button class="primary big" type="submit">저장하고 연결하기</button>
        <p id="settingsMsg" class="msg"></p>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
